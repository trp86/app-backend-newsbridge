name: DB Retention Cleanup

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      days:
        description: "Retention period in days (default: 7)"
        required: false
        default: "7"
      dry_run:
        description: "Dry run — preview without deleting"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  cleanup:
    name: Delete articles older than 7 days
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg[binary]

      - name: Run retention cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/retention_cleanup.py --days ${RETENTION_DAYS} $DRY_RUN_FLAG
